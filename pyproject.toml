[project]
name = "erp-bigstar"
version = "0.1.0"
description = "ERP modular monolith for Big Star and Forma Kids."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aio-pika==10.0.1",
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "celery==5.6.3",
    "cryptography==46.0.3",
    "defusedxml==0.7.1",
    "fastapi==0.141.1",
    "minio==7.2.20",
    "openpyxl==3.1.5",
    "pydantic-settings==2.15.0",
    "reportlab==4.4.4",
    "sqlalchemy[asyncio]==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "coverage[toml]==7.16.0",
    "httpx2==2.12.0",
    "mypy==2.3.1",
    "pdfplumber==0.11.7",
    "pip-audit==2.10.1",
    "playwright==1.62.0",
    "pypdf==6.1.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "types-defusedxml==0.7.0.20260504",
    "types-openpyxl==3.1.5.20260827",
    "types-reportlab==5.0.0.20261006",
]

[tool.uv]
default-groups = ["dev"]
package = false
required-version = "==0.12.10"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["Arquivos .MD"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "ISC",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "UP",
]
ignore = ["ISC001"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
exclude = ['^Arquivos[ ]\.MD[\\/]']

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
markers = [
    "browser: exercises the real web UI in Chromium",
    "integration: exercises a real infrastructure dependency",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
parallel = true
relative_files = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 80
show_missing = true
skip_covered = true
