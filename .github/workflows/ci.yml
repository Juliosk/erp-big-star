name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, migrations, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: erp_oltp
      POSTGRES_USER: erp_app
      POSTGRES_PASSWORD: ci_only_postgres_password
      READINESS_DATABASE_TIMEOUT_SECONDS: 5
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_AMQP_PORT: 5672
      RABBITMQ_DEFAULT_USER: erp_app
      RABBITMQ_DEFAULT_PASS: ci_only_rabbitmq_password
      MINIO_ROOT_USER: erp_ci
      MINIO_ROOT_PASSWORD: ci_only_minio_password_12345
      MINIO_API_PORT: 9000

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: erp_oltp
          POSTGRES_USER: erp_app
          POSTGRES_PASSWORD: ci_only_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_app -d erp_oltp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.2.9-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: erp_app
          RABBITMQ_DEFAULT_PASS: ci_only_rabbitmq_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Verify lockfile and install dependencies
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run strict type checks
        run: uv run mypy erp tests migrations

      - name: Validate migrations against PostgreSQL
        run: uv run alembic upgrade head

      - name: Start private MinIO for import integration tests
        run: |
          docker run --detach --name erp-minio-ci --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER --env MINIO_ROOT_PASSWORD \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          curl --fail --silent --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:9000/minio/health/live

      - name: Install Chromium for browser E2E
        run: uv run playwright install --with-deps chromium

      - name: Run backend and browser tests with coverage gate
        run: uv run pytest --cov=erp --cov-report=term-missing --cov-report=xml

      - name: Enforce complete M2 statement and branch coverage
        run: uv run coverage report --include="erp/modules/product/*" --fail-under=100 --precision=2

      - name: Enforce complete M23 statement and branch coverage
        run: uv run coverage report --include="erp/modules/governance/*" --fail-under=100 --precision=2

      - name: Audit Python dependencies
        run: uv run pip-audit
