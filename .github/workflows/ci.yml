name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, migrations, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: erp_oltp
      POSTGRES_USER: erp_app
      POSTGRES_PASSWORD: ci_only_postgres_password
      READINESS_DATABASE_TIMEOUT_SECONDS: 5

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: erp_oltp
          POSTGRES_USER: erp_app
          POSTGRES_PASSWORD: ci_only_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_app -d erp_oltp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Verify lockfile and install dependencies
        run: |
          uv lock --check
          uv sync --locked --all-groups

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run strict type checks
        run: uv run mypy erp tests migrations

      - name: Validate migrations against PostgreSQL
        run: uv run alembic upgrade head

      - name: Run tests with coverage gate
        run: uv run pytest --cov=erp --cov-report=term-missing --cov-report=xml

      - name: Audit Python dependencies
        run: uv run pip-audit
